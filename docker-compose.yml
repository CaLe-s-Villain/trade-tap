version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: trade-tap-db
    restart: unless-stopped
    ports:
      - '5433:5432' # Expose to host as 5433 to avoid conflicts with local Postgres
    env_file:
      - .env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: trade-tap-server
    ports:
      - '5001:5001'
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    volumes:
      - ./server:/app
    command: >
      sh -c "
        ./scripts/wait-for-db.sh db 5432 &&
        npx sequelize-cli db:migrate &&
        npx sequelize-cli db:seed:all &&
        npm run dev
      "

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://server:5001
    depends_on:
      - server

volumes:
  pgdata:
