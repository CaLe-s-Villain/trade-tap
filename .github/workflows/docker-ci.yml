name: Full Stack Docker Compose CI

on:
  pull_request:
    branches: [main, dev, stage]
  push:
    branches: [main, dev, stage]

jobs:
  docker-ci:
    name: Docker Compose Full Stack Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose stack
        run: |
          docker-compose -f docker-compose.yml -f docker-compose.override.yml up -d --build

      - name: Wait for services to start
        run: sleep 15

      - name: List running containers
        run: docker ps

      - name: Smoke test - Backend
        run: |
          curl --fail http://localhost:5001 || (echo "❌ Backend not responding on port 5001" && exit 1)

      - name: Smoke test - Frontend
        run: |
          curl --fail http://localhost:5173 || (echo "❌ Frontend not responding on port 5173" && exit 1)

      - name: Tear down containers
        if: always()
        run: docker-compose down --volumes
