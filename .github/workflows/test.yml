name: Test Suite

on:
  pull_request:
    branches: [main, stage, dev]

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack and npm workspaces
        run: |
          corepack enable
          npm ci --ignore-scripts

  client-unit-tests:
    name: Client Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install all workspace dependencies
        run: npm ci --ignore-scripts

      - name: Run client tests
        run: npm test --workspace client

  server-unit-tests:
    name: Server Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install all workspace dependencies
        run: npm ci --ignore-scripts

      - name: Run server tests
        run: npm test --workspace server

  lint:
    name: Lint (client + server)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install all workspace dependencies
        run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint
