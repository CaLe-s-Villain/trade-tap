name: Auto-Create or Recreate Branch

on:
  issues:
    types: [assigned]
  issue_comment:
    types: [created]

jobs:
  create-branch:
    if: |
      github.event.action == 'assigned' ||
      (github.event.action == 'created' && github.event.comment.body == '/recreate-branch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup and branch logic
        id: setup
        run: |
          echo "🔍 Determining branch name and label..."

          ISSUE_NUMBER="${{ github.event.issue.number }}"
          ISSUE_TITLE_RAW="${{ github.event.issue.title }}"
          COMMENT_TRIGGER="${{ github.event.comment.body }}"
          STOP_WORDS=("create" "add" "fix" "update" "for" "to" "the" "a" "an" "of" "with" "is" "on" "in" "project")

          # Pull all labels and filter for priority
          LABELS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.event.issue.url }}" | jq -r '.labels[].name' | tr '[:upper:]' '[:lower:]')

          PRIORITY_LABELS=("hotfix" "ci/cd" "feature" "bugfix" "security" "performance" "documentation" "test")
          SELECTED_LABEL=""
          for label in "${PRIORITY_LABELS[@]}"; do
            if echo "$LABELS" | grep -q "$label"; then
              SELECTED_LABEL=$label
              break
            fi
          done

          if [[ -z "$SELECTED_LABEL" ]]; then
            echo "❌ No valid label found. Exiting."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Slugify title
          CLEAN_TITLE=$(echo "$ISSUE_TITLE_RAW" | tr '[:upper:]' '[:lower:]')
          WORDS=($(echo "$CLEAN_TITLE" | tr -cd '[:alnum:] [:space:]-' | tr ' ' '\n'))
          SHORTENED=()
          for word in "${WORDS[@]}"; do
            skip=false
            for stop in "${STOP_WORDS[@]}"; do
              [[ "$word" == "$stop" ]] && skip=true && break
            done
            $skip || SHORTENED+=("$word")
            [[ ${#SHORTENED[@]} -ge 4 ]] && break
          done
          SLUG=$(IFS=- ; echo "${SHORTENED[*]}")

          # Label alias to branch prefix
          case "$SELECTED_LABEL" in
            feature)       SAFE_LABEL="feat" ;;
            bugfix)        SAFE_LABEL="fix" ;;
            documentation) SAFE_LABEL="docs" ;;
            test)          SAFE_LABEL="test" ;;
            ci/cd)         SAFE_LABEL="ci-cd" ;;
            security)      SAFE_LABEL="sec" ;;
            performance)   SAFE_LABEL="perf" ;;
            *)             SAFE_LABEL=$(echo "$SELECTED_LABEL" | tr '/' '-') ;;
          esac

          BRANCH_NAME="${SAFE_LABEL}/${ISSUE_NUMBER}-${SLUG}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Check if branch already exists
        id: check-branch
        if: steps.setup.outputs.skip != 'true'
        run: |
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push branch
        if: steps.setup.outputs.skip != 'true' && (github.event.action == 'assigned' && steps.check-branch.outputs.exists == 'false') || github.event.comment.body == '/recreate-branch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git checkout origin/dev
          git checkout -b "$BRANCH_NAME"
          git push https://x-access-token:${{ secrets.ACTIONS_PAT }}@github.com/${{ github.repository }}.git "$BRANCH_NAME"

      - name: Comment on issue
        if: steps.setup.outputs.skip != 'true'
        run: |
          COMMENT_URL="${{ github.event.issue.comments_url }}"
          MESSAGE=""

          if [[ "${{ github.event.comment.body }}" == "/recreate-branch" ]]; then
            MESSAGE="🔄 Recreated branch: \`$BRANCH_NAME\`"
          elif [[ "${{ steps.check-branch.outputs.exists }}" == "true" ]]; then
            MESSAGE="✅ Branch already exists: \`$BRANCH_NAME\` — comment \`/recreate-branch\` if you want to refresh it."
          else
            MESSAGE="🚀 Branch created from \`dev\`: \`$BRANCH_NAME\`"
          fi

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.ACTIONS_PAT }}" \
            -d "{\"body\": \"$MESSAGE\"}" \
            "$COMMENT_URL"
